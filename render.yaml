# Render Blueprint for the Ledgio backend API.
#
# How to use: go to https://dashboard.render.com -> "New +" -> "Blueprint",
# connect this GitHub repo, and Render will read this file and provision
# everything below. Env vars marked `sync: false` are left blank here on
# purpose - Render will prompt you to fill them in during setup (nothing
# secret is committed to the repo). Vars marked `generateValue: true` are
# auto-generated by Render itself.
#
# Only the backend is deployed here - the frontend (Vite/React SPA) is a
# separate static-hosting concern (Render Static Site, Vercel, Netlify, etc.)
# not covered by this file.
#
# Database: Postgres is NOT provisioned by this Blueprint - it uses Prisma
# Postgres instead (https://console.prisma.io -> create/open a Prisma Postgres
# database -> "Connect" tab has both connection strings this needs):
#   - DATABASE_URL: the POOLED connection string (host pooled.db.prisma.io) -
#     what the app uses for normal runtime queries.
#   - DIRECT_URL: the DIRECT connection string (host db.prisma.io) - required
#     for `prisma migrate deploy`, which needs session continuity that the
#     pooled connection doesn't provide. See backend/prisma/schema.prisma's
#     `directUrl` field.
# Both are required - Prisma errors on migrate commands if DIRECT_URL is
# missing once directUrl is declared in the schema, even though the app's own
# queries only ever use DATABASE_URL.

services:
  # Redis - used for distributed rate limiting and caching (tenant lookups,
  # JWT revocation list). See backend/src/config/redis.ts.
  - type: keyvalue
    name: ledgio-redis
    plan: free
    ipAllowList: [] # empty = only accessible from other services in this Render account/region

  # The backend API itself.
  - type: web
    name: ledgio-backend
    runtime: node
    rootDir: backend
    plan: free # Free tier for now while onboarding early clients - it spins
    # the service down after 15 min idle, so the next request after a quiet
    # period has a slow cold-start. Upgrade to `starter` (or higher) once
    # there's a real paying client base that needs always-on responsiveness.
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production

      # Paste the two connection strings from your Prisma Postgres database's
      # "Connect" tab in Prisma Console (console.prisma.io) - see the header
      # comment above for which is which.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ledgio-redis
          property: connectionString

      # Auto-generated by Render - no action needed.
      - key: JWT_SECRET
        generateValue: true
      - key: BROADCAST_MASTER_SECRET
        generateValue: true

      # You'll be prompted for these during Blueprint setup (or set them
      # later in the Render dashboard under this service's Environment tab).
      - key: APP_URL # your deployed frontend's real URL, e.g. https://app.ledgio.example
        sync: false
      - key: CORS_ALLOWED_ORIGINS # comma-separated frontend origin(s); falls back to APP_URL if unset
        sync: false
      - key: TRUST_PROXY # Render puts its own proxy in front of every web service
        value: "1"

      # All optional - each feature cleanly reports "not configured" instead
      # of faking data if left blank. Fill in only the ones you're using.
      - key: MONO_SECRET_KEY
        sync: false
      - key: MONO_WEBHOOK_SECRET
        sync: false
      - key: FX_RATE_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: MNOTIFY_API_KEY
        sync: false
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_USER
        sync: false
      - key: SMS_GATEWAY_PASS
        sync: false
      - key: SMS_SENDER_ID
        sync: false

      - key: OTEL_ENABLED
        value: "false" # no OTLP collector deployed alongside this blueprint;
        # flip to "true" and set OTEL_EXPORTER_OTLP_ENDPOINT if you stand one up
